<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .bg-grid {
      animation: gridPulse 8s ease-in-out infinite alternate;
    }
    @keyframes gridPulse {
      0% { opacity: 0.3; }
      100% { opacity: 0.7; }
    }
    .node-pulse {
      animation: pulse 3s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: dashMove 14s linear infinite;
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -200; }
    }
    .radar-sweep {
      transform-origin: 1060px 170px;
      animation: rotateSweep 6s linear infinite;
    }
    @keyframes rotateSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .shield-float {
      animation: floatShield 5s ease-in-out infinite alternate;
    }
    @keyframes floatShield {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#cyberGrid)" rx="16" class="bg-grid" />

  <!-- Animated Ambient Network Connections (Background) -->
  <g opacity="0.35">
    <path class="flow-line" d="M 50 80 Q 300 20 600 80 T 1150 60" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="flow-line" d="M 80 280 Q 400 320 700 260 T 1120 280" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="280" cy="50" r="4" fill="#38bdf8" class="node-pulse" />
    <circle cx="600" cy="80" r="5" fill="#818cf8" class="node-pulse" />
    <circle cx="850" cy="55" r="3.5" fill="#38bdf8" />
    <circle cx="450" cy="295" r="4" fill="#818cf8" class="node-pulse" />
    <circle cx="920" cy="275" r="4.5" fill="#38bdf8" />
  </g>

  <!-- Animated Radar Graphic on Right Side (Background) -->
  <g opacity="0.4">
    <circle cx="1060" cy="170" r="100" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="1060" cy="170" r="70" fill="none" stroke="#334155" stroke-width="1" />
    <circle cx="1060" cy="170" r="40" fill="none" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="960" y1="170" x2="1160" y2="170" stroke="#1e293b" stroke-width="1" />
    <line x1="1060" y1="70" x2="1060" y2="270" stroke="#1e293b" stroke-width="1" />
    <!-- Radar Sweep Needle -->
    <line class="radar-sweep" x1="1060" y1="170" x2="1160" y2="170" stroke="#38bdf8" stroke-width="2" opacity="0.75" />
  </g>

  <!-- Left Shield Icon (Floating Graphic in Foreground) -->
  <g class="shield-float" transform="translate(60, 85)">
    <!-- Shield Outer Glow -->
    <path d="M 45 5 L 85 20 C 85 65 55 105 45 115 C 35 105 5 65 5 20 Z" fill="url(#shieldGrad)" filter="url(#glow)" opacity="0.5" />
    <!-- Shield Main Body -->
    <path d="M 45 5 L 85 20 C 85 65 55 105 45 115 C 35 105 5 20 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Embedded Checkmark / Lock Inside Shield -->
    <path d="M 32 55 L 42 65 L 62 45" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Content: Header & Titles -->
  <g transform="translate(185, 0)">
    <!-- Small Category Pill -->
    <g transform="translate(0, 52)">
      <rect width="215" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8" class="node-pulse" />
      <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" letter-spacing="1">CURATED DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="url(#primaryTextGrad)" letter-spacing="-0.5">
      Awesome Small Business Endpoint Protection
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      Top Enterprise-Grade EDR, MDR, Next-Gen Antivirus &amp; Open-Source Endpoint Security for SMBs
    </text>

    <!-- Feature Attribute Badges / Pills -->
    <g transform="translate(0, 215)">
      <!-- Pill 1: EDR & MDR -->
      <g transform="translate(0, 0)">
        <rect width="170" height="40" rx="20" fill="url(#pillGrad1)" stroke="#0284c7" stroke-width="1" />
        <circle cx="22" cy="20" r="5" fill="#38bdf8" />
        <text x="38" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0f2fe">Cloud EDR &amp; MDR</text>
      </g>

      <!-- Pill 2: Open Source Tools -->
      <g transform="translate(185, 0)">
        <rect width="185" height="40" rx="20" fill="url(#pillGrad2)" stroke="#6366f1" stroke-width="1" />
        <circle cx="22" cy="20" r="5" fill="#818cf8" />
        <text x="38" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ede9fe">Open-Source HIDS/EDR</text>
      </g>

      <!-- Pill 3: Verified Pricing & Limits -->
      <g transform="translate(385, 0)">
        <rect width="200" height="40" rx="20" fill="url(#pillGrad3)" stroke="#10b981" stroke-width="1" />
        <circle cx="22" cy="20" r="5" fill="#34d399" />
        <text x="38" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d1fae5">Verified Pricing &amp; Trials</text>
      </g>
    </g>
  </g>
</svg>
